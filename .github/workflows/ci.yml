# Tests and build on every change (specs/014-deployment). It does not publish the site:
# the hosting builds from the repository on its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
